[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyosm-agents"
version = "0.4.0"
description = "Agent-safe OpenStreetMap tools and an MCP server"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "pyosm-agents contributors" }
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.10",
    "pyproj>=3.7",
    "shapely>=2.0.6",
    "typing-extensions>=4.9",
]

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]

[project.scripts]
pyosm-mcp = "pyosm_agents.mcp:main"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]
lint = [
    "mypy>=1.14",
    "ruff>=0.8",
    "types-shapely>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyosm_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
